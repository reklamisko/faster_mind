<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odbiornik TV - Faster Mind</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #fff; }
    #ekran-pinu { text-align: center; }
    #pin-input { font-size: 40px; text-align: center; letter-spacing: 10px; width: 200px; padding: 10px; border: 2px solid #ccc; border-radius: 10px; }
    button { font-size: 24px; padding: 15px 40px; margin-top: 20px; background-color: #2196F3; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #blad { color: red; margin-top: 20px; font-size: 18px; }
    #tabela-pojemnik { display: none; width: 100%; height: 100vh; overflow: auto; padding: 20px; box-sizing: border-box; }
    table { border-collapse: collapse; margin: auto; }
    
    /* Zoptymalizowany wygląd (z poprzedniego kroku) */
    td, th { padding: 0.4px 3px; text-align: center; border: 1px solid black; font-size: 16px; font-weight: bold; }
    th { background-color: #e0e0e0; font-size: 18px; }
  </style>
</head>
<body>

  <div id="ekran-pinu">
    <h1 style="color: #607d8b; font-size: 60px; margin-bottom: 10px;">📺</h1>
    <h2>Wpisz kod PIN z telefonu:</h2>
    <input type="text" id="pin-input" maxlength="4" autocomplete="off"><br>
    <button onclick="pobierzTabliczke()">POKAŻ TABELĘ</button>
    <div id="blad"></div>
  </div>

  <div id="tabela-pojemnik">
    <table id="tabliczka"></table>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    // Dodano import funkcji deleteDoc
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhJnzHIkF2twc8pXzb7AWuczldWsGIPIU",
      authDomain: "faster-mind-12a6f.firebaseapp.com",
      projectId: "faster-mind-12a6f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.pobierzTabliczke = async function() {
      const pin = document.getElementById('pin-input').value.trim();
      const bladDiv = document.getElementById('blad');
      bladDiv.innerText = "Szukam...";

      if(pin.length !== 4) {
        bladDiv.innerText = "Wpisz 4 cyfry!";
        return;
      }

      try {
        const docRef = doc(db, "sesje_tv", pin);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          rysujTabele(docSnap.data());
          document.getElementById('ekran-pinu').style.display = 'none';
          document.getElementById('tabela-pojemnik').style.display = 'block';
          
          // KASOWANIE REKORDU: Zwalniamy PIN natychmiast po narysowaniu tabeli
          await deleteDoc(docRef);
        } else {
          bladDiv.innerText = "Nie znaleziono tabliczki dla tego PIN-u!";
        }
      } catch (e) {
        bladDiv.innerText = "Błąd połączenia: " + e.message;
      }
    };

    function rysujTabele(dane) {
      const { poziomMin = 1, poziomMax = 10, pionMin = 1, pionMax = 10, styl = 'szkic' } = dane;
      const tabela = document.getElementById('tabliczka');
      let html = '';

      for (let wiersz = 0; wiersz <= pionMax - pionMin + 1; wiersz++) {
        html += '<tr>';
        for (let kolumna = 0; kolumna <= poziomMax - poziomMin + 1; kolumna++) {
          let y = wiersz === 0 ? 0 : pionMin + wiersz - 1;
          let x = kolumna === 0 ? 0 : poziomMin + kolumna - 1;
          let tekst = (wiersz === 0 && kolumna === 0) ? '×' : (wiersz === 0 ? x : (kolumna === 0 ? y : x * y));
          let bg = '#ffffff';

          if (wiersz === 0 || kolumna === 0) {
            bg = '#e0e0e0';
          } else if (styl === 'mono') {
            if (x % 2 === 0 && y % 2 === 0) bg = '#90a4ae';
            else if (x % 2 === 0 || y % 2 === 0) bg = '#cfd8dc';
          } else if (styl === 'tecza') {
            let maxVal = Math.max(x, y);
            const kolory = ["#ffcdd2", "#e1bee7", "#c5cae9", "#bbdefb", "#b2ebf2", "#b2dfdb", "#c8e6c9", "#f0f4c3", "#fff9c4", "#ffe0b2"];
            bg = kolory[maxVal % 10];
          }

          let tag = (wiersz === 0 || kolumna === 0) ? 'th' : 'td';
          html += `<${tag} style="background-color: ${bg}">${tekst}</${tag}>`;
        }
        html += '</tr>';
      }
      tabela.innerHTML = html;
    }
  </script>
</body>
</html>
